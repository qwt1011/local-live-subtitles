<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>本地实时字幕</title>
  <style>
    body { width: 250px; font: 13px/1.5 "Microsoft YaHei", Arial; padding: 12px; margin: 0; color: #222; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    label { display: flex; align-items: center; gap: 6px; }
    select, button { width: 100%; padding: 7px; margin-top: 8px; font: inherit; box-sizing: border-box; }
    .row { margin-top: 8px; }
    #status { margin-top: 10px; padding: 8px; border-radius: 4px; background: #f2f3f5; white-space: pre-line; font-size: 12px; }
    .ok { color: #17692f; }
    .bad { color: #a01b1b; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <h1>本地实时字幕</h1>

  <label><input id="enabled" type="checkbox"> 显示字幕</label>

  <div class="row">
    <select id="language">
      <option value="ja">日语</option>
      <option value="en">英语</option>
    </select>
  </div>

  <div class="row">
    <select id="mode">
      <option value="bilingual">原文 + 中文</option>
      <option value="original">仅原文</option>
      <option value="translation">仅中文</option>
    </select>
  </div>

  <button id="capture">开始捕获当前标签页</button>
  <button id="ping">检查本地服务</button>

  <div id="status">未连接本地服务</div>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
