<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>本地实时字幕</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <h1>本地实时字幕</h1>
    <label class="top-toggle popup-only" title="字幕进行中时，在网页上显示可拖动的控制浮窗（快捷键 Alt+S）">
      <span>浮窗</span>
      <span class="switch small">
        <input id="panelShown" type="checkbox" role="switch">
        <span class="track" aria-hidden="true"></span>
      </span>
    </label>
    <label class="top-toggle" title="在页面上显示字幕（不影响识别）">
      <span>显示字幕</span>
      <span class="switch small">
        <input id="enabled" type="checkbox" role="switch">
        <span class="track" aria-hidden="true"></span>
      </span>
    </label>
  </header>

  <section id="statusCard" class="card status" aria-live="polite">
    <span id="statusDot" class="dot" aria-hidden="true"></span>
    <div class="status-text">
      <div id="statusTitle" class="status-title">正在检查本地服务…</div>
      <div id="statusDetail" class="status-detail"></div>
    </div>
  </section>

  <div id="problem" class="problem" role="alert" hidden></div>

  <button id="primary" class="primary" type="button">
    <span class="spinner" aria-hidden="true"></span>
    <span id="primaryLabel">开始字幕</span>
  </button>

  <div id="sessionLine" class="session-line" hidden></div>

  <section class="card settings">
    <div class="field">
      <label for="asr" class="field-label">识别</label>
      <div class="select-wrap">
        <select id="asr"></select>
        <div id="asrHint" class="hint"></div>
      </div>
    </div>

    <div class="field">
      <span class="field-label" id="languageLabel">语言</span>
      <div class="segmented" role="radiogroup" aria-labelledby="languageLabel" data-name="language">
        <button type="button" role="radio" data-value="ja">日语</button>
        <button type="button" role="radio" data-value="en">英语</button>
      </div>
    </div>

    <div class="field">
      <span class="field-label" id="modeLabel">显示</span>
      <div class="segmented" role="radiogroup" aria-labelledby="modeLabel" data-name="mode">
        <button type="button" role="radio" data-value="bilingual">原文+中文</button>
        <button type="button" role="radio" data-value="original">原文</button>
        <button type="button" role="radio" data-value="translation">中文</button>
      </div>
    </div>
  </section>

  <details id="advanced" class="advanced">
    <summary>
      <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg>
      高级
    </summary>
    <div class="advanced-body">
      <label class="toggle-row" title="两句话被连在一起识别时，前半句先定稿翻译">
        <span>粘连句提前定稿<small>实验 · 下次开始字幕时生效</small></span>
        <span class="switch small">
          <input id="earlyFinal" type="checkbox" role="switch">
          <span class="track" aria-hidden="true"></span>
        </span>
      </label>
      <label class="toggle-row" title="识别结果以ね/よ/わ/？等句末结尾时，只等 0.2 秒静音就定稿（可能切出碎句）">
        <span>句末短静音定稿<small>实验 · 下次开始字幕时生效</small></span>
        <span class="switch small">
          <input id="adaptiveSilence" type="checkbox" role="switch">
          <span class="track" aria-hidden="true"></span>
        </span>
      </label>
      <div class="toggle-row">
        <label for="idle">闲置自动关闭服务<small>一键启动的服务，无字幕多久后退出</small></label>
        <select id="idle" class="compact">
          <option value="15">15 分钟</option>
          <option value="30">30 分钟</option>
          <option value="60">1 小时</option>
          <option value="0">不关闭</option>
        </select>
      </div>
      <div class="button-row">
        <button id="viewLog" type="button" class="ghost">查看服务日志</button>
        <button id="stopService" type="button" class="ghost danger">停止服务</button>
      </div>
      <p id="hostHint" class="hint" hidden></p>
    </div>
  </details>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
